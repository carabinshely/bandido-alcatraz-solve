name: Worker36 synthetic profile diagnostic

on:
  pull_request:
    types: [edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: worker36-synthetic-single-allocation
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.repository == 'carabinshely/bandido-alcatraz-solve' &&
      github.event.sender.login == 'carabinshely' && github.actor == 'carabinshely' &&
      github.event.pull_request.user.login == 'carabinshely' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/worker36-synthetic-profile-overhead' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == '9c1eeeb8a26868d41f8d8d89b17fc897a60cb38b' &&
      github.run_attempt == 1 && github.event.changes.body != null &&
      !contains(github.event.changes.body.from, 'WORKER36_ADMISSION') &&
      contains(github.event.pull_request.body, 'WORKER36_ADMISSION_JSON')
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 45
    steps:
      - name: Initialize exclusive runner-owned durable custody paths
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_INPUT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          for variable in "${!LD@}" "${!PYTHON@}"; do
            [[ -z "$variable" ]] || unset "$variable"
          done
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = carabinshely/bandido-alcatraz-solve
          test "$GITHUB_ACTOR" = carabinshely
          test "$RUNNER_NAME" = bandido-alcatraz-ci
          test "$GITHUB_SERVER_URL" = https://github.com
          test "$GITHUB_API_URL" = https://api.github.com
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD_INPUT" =~ ^[a-f0-9]{40}$ ]]
          command -v gh
          command -v jq
          test -d "$RUNNER_TOOL_CACHE"
          test ! -L "$RUNNER_TOOL_CACHE"
          cache=$(realpath -e -- "$RUNNER_TOOL_CACHE")
          workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
          temporary=$(realpath -e -- "$RUNNER_TEMP")
          for path in "$cache" "$workspace" "$temporary"; do [[ "$path" != *$'\n'* && "$path" != *$'\r'* ]]; done
          base="$cache/worker36-evidence"
          claim="$cache/worker36-one-shot-claims"
          for path in "$base" "$claim"; do
            case "$path/" in "$workspace/"*|"$temporary/"*) exit 1 ;; esac
            if test ! -e "$path"; then mkdir -m 700 -- "$path"; fi
            test -d "$path" && test ! -L "$path"
            test "$(stat -c %u -- "$path")" = "$(id -u)"
            test "$(stat -c %a -- "$path")" = 700
          done
          durable="$base/run-$GITHUB_RUN_ID-attempt-1"
          mkdir -m 700 -- "$durable"
          auth="$durable/admission-inputs"
          mkdir -m 700 -- "$auth"
          attempt="$durable/worker36-$GITHUB_RUN_ID-1"
          transport="$durable/transport"
          test ! -e "$attempt" && test ! -e "$transport"
          set -o noclobber
          cat -- "$GITHUB_EVENT_PATH" > "$auth/event.json"
          jq -n --arg cache "$cache" --arg workspace "$workspace" --arg temporary "$temporary" \
            --arg durable "$durable" --arg attempt "$attempt" --arg run "$GITHUB_RUN_ID" --arg number "$PR_NUMBER" \
            '{schema:"worker36-github-request-context-v1",repository:"carabinshely/bandido-alcatraz-solve",
              event_name:"pull_request",workflow_run:$run,workflow_attempt:"1",server_url:"https://github.com",
              api_url:"https://api.github.com",authentication:"github-repository-read-token",
              pull_request_request:{method:"GET",url:("https://api.github.com/repos/carabinshely/bandido-alcatraz-solve/pulls/"+$number)},
              postmerge_ci_request:{method:"GET",url:"https://api.github.com/repos/carabinshely/bandido-alcatraz-solve/actions/runs/37108669492"},
              runner_name:"bandido-alcatraz-ci",actor:"carabinshely",
              run_url:("https://github.com/carabinshely/bandido-alcatraz-solve/actions/runs/"+$run),
              attempt_id:("worker36-"+$run+"-1"),runner_tool_cache:$cache,checkout_path:$workspace,
              runner_temp:$temporary,durable_root:$durable,attempt_path:$attempt}' > "$auth/request-context.json"
          sync -f "$auth"
          {
            printf 'DURABLE=%s\nAUTH=%s\nATTEMPT=%s\nTRANSPORT=%s\n' "$durable" "$auth" "$attempt" "$transport"
            printf 'WORKER36_CLAIM_DIRECTORY=%s\nEXPECTED_HEAD=%s\nPR_NUMBER=%s\n' "$claim" "$EXPECTED_HEAD_INPUT" "$PR_NUMBER"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Authenticate fresh PR-body first admission and postmerge CI
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source "$GITHUB_WORKSPACE/scripts/worker36-loader.sh"
          worker36_loader_setup
          set -o noclobber
          gh api --hostname github.com --method GET -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$AUTH/pull-request.json"
          gh api --hostname github.com --method GET -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/37108669492" > "$AUTH/postmerge-ci.json"
          sync -f "$AUTH"
          "$WORKER36_PYTHON" -B -s scripts/worker36/admission.py authenticate \
            --event "$AUTH/event.json" --pull-request "$AUTH/pull-request.json" \
            --ci "$AUTH/postmerge-ci.json" --request-context "$AUTH/request-context.json" \
            --destination "$AUTH/admission.json" --provenance "$AUTH/provenance.json" \
            --workflow-run "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT"
          digest=$(sha256sum "$AUTH/admission.json" | cut -d ' ' -f 1)
          provenance_digest=$(sha256sum "$AUTH/provenance.json" | cut -d ' ' -f 1)
          tree=$(git rev-parse 'HEAD^{tree}')
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(jq -r .head "$AUTH/provenance.json")" = "$EXPECTED_HEAD"
          test "$(jq -r .tree "$AUTH/provenance.json")" = "$tree"
          test "$(jq -r .admission_sha256 "$AUTH/provenance.json")" = "$digest"
          printf 'ADMISSION_SHA256=%s\nADMISSION_PROVENANCE_SHA256=%s\nEXPECTED_TREE=%s\n' "$digest" "$provenance_digest" "$tree" >> "$GITHUB_ENV"
          # These authenticated values may bootstrap preservation without hashing
          # or JSON parsing outside its already established original deadline.
          verified_library_sha256=$(jq -er '.loader_pin.library_sha256' "$AUTH/admission.json")
          verified_library_size_bytes=$(jq -er '.loader_pin.library_size_bytes' "$AUTH/admission.json")
          test "$WORKER36_LOADER_SHA256" = "$verified_library_sha256"
          test "$WORKER36_LOADER_SIZE_BYTES" = "$verified_library_size_bytes"
          printf 'WORKER36_PRESERVE_EXECUTABLE=%s\nWORKER36_PRESERVE_LIBRARY_DIRECTORY=%s\nWORKER36_PRESERVE_LIBRARY_SHA256=%s\nWORKER36_PRESERVE_LIBRARY_SIZE_BYTES=%s\n' \
            "$WORKER36_PYTHON" "$WORKER36_LOADER_DIRECTORY" "$verified_library_sha256" "$verified_library_size_bytes" >> "$GITHUB_ENV"
      - name: One admitted serial measurement allocation
        id: measurement
        shell: bash
        run: |
          set -euo pipefail
          for variable in "${!LD@}" "${!PYTHON@}"; do
            [[ -z "$variable" ]] || unset "$variable"
          done
          source "$GITHUB_WORKSPACE/scripts/worker36-loader.sh"
          expected_library_sha256=$(jq -er '.loader_pin.library_sha256' "$AUTH/admission.json")
          expected_library_size_bytes=$(jq -er '.loader_pin.library_size_bytes' "$AUTH/admission.json")
          worker36_loader_setup "$expected_library_sha256" "$expected_library_size_bytes"
          "$WORKER36_PYTHON" -B -s "$GITHUB_WORKSPACE/scripts/run_worker36_synthetic.py" measure \
            --attempt "$ATTEMPT" --admission "$AUTH/admission.json" \
            --admission-sha256 "$ADMISSION_SHA256" --admission-provenance "$AUTH/provenance.json" \
            --admission-provenance-sha256 "$ADMISSION_PROVENANCE_SHA256"
      - name: Preserve verification result and all partial transport without retry
        if: always() && steps.admission.outcome == 'success'
        env:
          PRESERVATION_MONOTONIC_DEADLINE_MS: ${{ steps.measurement.outputs.preservation_deadline_monotonic_ms }}
          PRESERVATION_BOOTTIME_DEADLINE_MS: ${{ steps.measurement.outputs.preservation_deadline_boottime_ms }}
          PRESERVATION_BOOT_ID: ${{ steps.measurement.outputs.preservation_boot_id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set -o noclobber
          outcome_status=bootstrap_blocked
          outcome_reason=invalid_deadline_handoff
          launched=false
          remaining_ms=null
          monotonic_ms=null
          boottime_ms=null
          boot_id_json=null
          boot_verified=false
          record_shell_outcome() {
            local code=$1
            trap - EXIT
            # A bounded best-effort marker is not a confirmed post-deadline
            # fsync, completed archive, successful custody, or research result.
            if ! printf '{"schema":"worker36-preservation-shell-r1-v1","status":"%s","reason":"%s","exit_code":%d,"launch_attempted":%s,"remaining_ms_at_launch":%s,"original_monotonic_deadline_ms":%s,"original_boottime_deadline_ms":%s,"original_boot_id":%s,"boot_id_verified":%s,"fsync_confirmed":false,"classification":null,"raw_prefix_cleanup_performed":false,"bootstrap_evaluator_calls":0}\n' \
              "$outcome_status" "$outcome_reason" "$code" "$launched" "$remaining_ms" \
              "$monotonic_ms" "$boottime_ms" "$boot_id_json" "$boot_verified" \
              > "$DURABLE/preservation-shell-outcome.json"; then
              [[ "$code" != 0 ]] || code=74
            fi
            exit "$code"
          }
          trap 'record_shell_outcome "$?"' EXIT
          # Builtins only until timeout: no loader setup, JSON parser, hashing,
          # path resolution, or alternate interpreter can consume unbounded time.
          for variable in "${!LD@}" "${!PYTHON@}"; do
            [[ -z "$variable" ]] || unset "$variable"
          done
          [[ "${PRESERVATION_MONOTONIC_DEADLINE_MS-}" =~ ^[1-9][0-9]{0,14}$ ]] || exit 78
          [[ "${PRESERVATION_BOOTTIME_DEADLINE_MS-}" =~ ^[1-9][0-9]{0,14}$ ]] || exit 78
          [[ "${PRESERVATION_BOOT_ID-}" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]] || exit 78
          monotonic_ms=$PRESERVATION_MONOTONIC_DEADLINE_MS
          boottime_ms=$PRESERVATION_BOOTTIME_DEADLINE_MS
          boot_id_json="\"$PRESERVATION_BOOT_ID\""
          outcome_reason=invalid_carried_loader
          [[ "${WORKER36_PRESERVE_EXECUTABLE-}" == /* && "${WORKER36_PRESERVE_LIBRARY_DIRECTORY-}" == /* ]] || exit 78
          for path in "$WORKER36_PRESERVE_EXECUTABLE" "$WORKER36_PRESERVE_LIBRARY_DIRECTORY"; do
            [[ "$path" != *[[:space:]]* && "$path" != *:* && "$path" != *\\* ]] || exit 78
          done
          [[ "${WORKER36_PRESERVE_LIBRARY_SHA256-}" =~ ^[a-f0-9]{64}$ ]] || exit 78
          [[ "${WORKER36_PRESERVE_LIBRARY_SIZE_BYTES-}" =~ ^[1-9][0-9]{0,14}$ ]] || exit 78
          outcome_reason=boot_identity_mismatch
          IFS= read -r current_boot_id < /proc/sys/kernel/random/boot_id || exit 78
          [[ "$current_boot_id" == "$PRESERVATION_BOOT_ID" ]] || exit 78
          boot_verified=true
          export LD_LIBRARY_PATH="$WORKER36_PRESERVE_LIBRARY_DIRECTORY"
          export PYTHONHASHSEED=0 PYTHONDONTWRITEBYTECODE=1
          outcome_reason=invalid_uptime
          IFS=' ' read -r uptime unused < /proc/uptime || exit 78
          [[ "$uptime" =~ ^([0-9]{1,12})\.([0-9]{2})$ ]] || exit 78
          # Uptime is truncated to hundredths; adding one full hundredth is an
          # upper bound compatible with the coordinator's paired BOOTTIME clock.
          current_ms=$((10#${BASH_REMATCH[1]} * 1000 + 10#${BASH_REMATCH[2]} * 10 + 10))
          remaining_ms=$((10#$PRESERVATION_BOOTTIME_DEADLINE_MS - current_ms))
          outcome_reason=original_deadline_expired
          if (( remaining_ms <= 0 )); then
            outcome_status=deadline_exhausted
            exit 75
          fi
          outcome_reason=remaining_exceeds_original_cap
          (( remaining_ms <= 600000 )) || exit 78
          printf -v duration '%d.%03ds' "$((remaining_ms / 1000))" "$((remaining_ms % 1000))"
          outcome_status=preservation_failed
          outcome_reason=pinned_preservation_nonzero
          launched=true
          # No extra grace extends the original deadline. Loader and immutable
          # closing evidence are revalidated inside the already bounded Python.
          if timeout --signal=KILL "$duration" \
            "$WORKER36_PRESERVE_EXECUTABLE" -B -s "$GITHUB_WORKSPACE/scripts/run_worker36_synthetic.py" preserve \
            --attempt "$ATTEMPT" --destination "$TRANSPORT" \
            --report "$DURABLE/verification.json" --recovery-report "$DURABLE/recovery.json" \
            --admission "$AUTH/admission.json" --admission-sha256 "$ADMISSION_SHA256" \
            --admission-provenance "$AUTH/provenance.json" \
            --admission-provenance-sha256 "$ADMISSION_PROVENANCE_SHA256" --expected-head "$EXPECTED_HEAD" \
            --expected-tree "$EXPECTED_TREE" --expected-workflow-run "$GITHUB_RUN_ID" \
            --preservation-deadline-monotonic-ms "$PRESERVATION_MONOTONIC_DEADLINE_MS"; then
            outcome_status=preservation_returned_success
            outcome_reason=pinned_preservation_zero
            exit 0
          else
            code=$?
            if [[ "$code" == 137 || "$code" == 124 ]]; then
              outcome_status=deadline_exhausted
              outcome_reason=original_deadline_kill
            fi
            exit "$code"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && env.DURABLE != ''
        with:
          name: worker36-custody-reports-${{ github.run_id }}
          path: |
            ${{ env.AUTH }}/*.json
            ${{ env.DURABLE }}/verification.json
            ${{ env.DURABLE }}/recovery.json
            ${{ env.DURABLE }}/preservation-shell-outcome.json
            ${{ env.TRANSPORT }}/*.json
          if-no-files-found: warn
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always() && env.TRANSPORT != ''
        with:
          name: worker36-transport-001-${{ github.run_id }}
          path: ${{ env.TRANSPORT }}/part-001.bin
          if-no-files-found: warn
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always() && env.TRANSPORT != ''
        with:
          name: worker36-transport-002-${{ github.run_id }}
          path: ${{ env.TRANSPORT }}/part-002.bin
          if-no-files-found: warn
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always() && env.TRANSPORT != ''
        with:
          name: worker36-transport-003-${{ github.run_id }}
          path: ${{ env.TRANSPORT }}/part-003.bin
          if-no-files-found: warn
          compression-level: 0
      # Raw attempts, auth inputs, failed reports and partial payloads stay in the
      # runner-owned durable directory until explicit canonical-custody approval.
      # This workflow never removes, replaces, resumes or reruns an allocation.

name: Strategy guide Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'scripts/run_worker26.py'
      - 'data/**'
      - 'docs/**'
      - 'experiments/**'
      - 'tests/test_website.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strategy-guide-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Build and verify both language versions
        run: python -m pytest tests/test_website.py -q
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

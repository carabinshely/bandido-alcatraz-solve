name: Worker25 full-spent tier footprint

on:
  pull_request:
    paths:
      - scripts/run_worker25_full_spent_tier_footprint.py
      - .github/workflows/worker25-full-spent-tier-footprint.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: worker25-full-spent-tier-footprint
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true && github.head_ref == 'worker25-full-spent-tier-footprint'
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Test temporary preflight receipts (zero research seeds)
        run: python -m pytest -q scripts/test_worker25_preflight.py
      - name: Obtain canonical Worker24 ZIP (no research on missing input)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const response = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner, repo: context.repo.repo,
              artifact_id: 11059019669, archive_format: 'zip'
            });
            const dir = path.join(process.env.RUNNER_TEMP, 'worker25-input');
            fs.mkdirSync(dir, {recursive: true});
            fs.writeFileSync(path.join(dir, 'worker24.zip'), Buffer.from(response.data));
      - name: Canonical source and artifact preflight (zero seeds)
        run: python scripts/run_worker25_full_spent_tier_footprint.py --worker24-zip "$RUNNER_TEMP/worker25-input/worker24.zip" --preflight-only
      - name: Full frozen 100-seed prefix audit
        env:
          EVALUATED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python scripts/run_worker25_full_spent_tier_footprint.py --worker24-zip "$RUNNER_TEMP/worker25-input/worker24.zip"
      - name: Upload evidence including zero-seed preflight failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker25-full-spent-tier-footprint
          path: artifacts/raw/worker25/
          if-no-files-found: warn
          retention-days: 14

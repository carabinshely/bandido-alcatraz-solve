name: Issue23 SVG verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bandido-issue23-svg-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-svg:
    if: github.event.pull_request.head.ref == 'issue-23-svg-final-board-export'
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install -e .
      - name: Export all V7 final boards
        run: |
          python scripts/export_final_boards.py \
            --experiment V7 \
            --output-dir artifacts/v7-final-boards
      - name: Verify generated SVG batch
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("artifacts/v7-final-boards")
          manifest = json.loads((root / "manifest.json").read_text())
          svg_files = sorted(root.glob("*.svg"))

          assert manifest["game_count"] == 100
          assert manifest["wins"] == 7
          assert manifest["losses"] == 93
          assert len(svg_files) == 100
          assert svg_files[0].name == "001-seed-1000-loss.svg"
          assert svg_files[8].name == "009-seed-1008-win.svg"
          assert svg_files[-1].name == "100-seed-1099-loss.svg"
          assert manifest["provenance"]["final_records_checksum_verified"] is True

          markers = Counter()
          kinds = Counter()
          rotations = set()
          for path in svg_files:
              tree = ET.parse(path)
              svg = tree.getroot()
              assert svg.attrib["data-renderer"] == "bandido-alcatraz-final-board-v1"
              for element in svg.iter():
                  marker = element.attrib.get("data-marker")
                  if marker:
                      markers[marker] += 1
                  kind = element.attrib.get("data-kind")
                  if kind:
                      kinds[kind] += 1
                  quarter_turns = element.attrib.get("data-quarter-turns")
                  if quarter_turns is not None:
                      rotations.add(int(quarter_turns))

          assert kinds["start"] == 100
          assert kinds["exit"] > 0
          assert markers["open-end"] > 0
          assert markers["dead-end"] > 0
          assert markers["visible-water"] > 0
          assert len(rotations) >= 2

          summary = {
              "svg_count": len(svg_files),
              "wins": manifest["wins"],
              "losses": manifest["losses"],
              "markers": dict(markers),
              "placement_kinds": dict(kinds),
              "rotations": sorted(rotations),
              "sample_files": [
                  "001-seed-1000-loss.svg",
                  "009-seed-1008-win.svg",
                  "100-seed-1099-loss.svg",
              ],
          }
          (root / "verification-summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue23-v7-final-boards
          path: artifacts/v7-final-boards
          if-no-files-found: error
          retention-days: 7

name: tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bandido-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline_hash0:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install -e ".[dev]"
      - name: Canonical baseline replay hash 0
        env:
          PYTHONHASHSEED: "0"
        run: python scripts/run_real_policy_v4_canonical_baseline.py --output /tmp/canonical-baseline-hash0.json
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-baseline-hash0
          path: /tmp/canonical-baseline-hash0.json
          if-no-files-found: error

  baseline_hash1:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install -e ".[dev]"
      - name: Canonical baseline replay hash 1
        env:
          PYTHONHASHSEED: "1"
        run: python scripts/run_real_policy_v4_canonical_baseline.py --output /tmp/canonical-baseline-hash1.json
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-baseline-hash1
          path: /tmp/canonical-baseline-hash1.json
          if-no-files-found: error

  diagnose:
    needs: [baseline_hash0, baseline_hash1]
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: canonical-baseline-hash0
          path: /tmp/hash0
      - uses: actions/download-artifact@v4
        with:
          name: canonical-baseline-hash1
          path: /tmp/hash1
      - name: Canonical mechanism diagnosis after determinism gate
        env:
          PYTHONHASHSEED: "0"
        run: |
          python scripts/run_real_policy_v4_canonical_mechanism.py \
            --baseline-zero /tmp/hash0/canonical-baseline-hash0.json \
            --baseline-one /tmp/hash1/canonical-baseline-hash1.json \
            --historical-receipt experiments/real-deck-policy-v4/stability-holdout-2026-09-21.json \
            --output /tmp/canonical-mechanism-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-mechanism-replay
          path: /tmp/canonical-mechanism-replay.json
          if-no-files-found: error

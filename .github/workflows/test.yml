name: tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bandido-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Report runner and Python
        run: python -c "import os, platform, sys; print('Runner=' + os.environ['RUNNER_NAME']); print('Python=' + platform.python_version()); print('Executable=' + sys.executable); assert sys.version_info[:2] == (3, 11)"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Synthetic simulation smoke
        run: python scripts/run_synthetic_smoke.py
      - name: Proxy transcription status
        run: python scripts/proxy_status.py
      - name: Real photographed-deck smoke
        run: python scripts/run_real_deck_smoke.py
      - name: Worker #9 direct terminal-half diagnostic
        env:
          EVALUATED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python scripts/run_worker9_direct_terminal_half_kill.py --output artifacts/preloss-direct-terminal-half-kill-audit-2026-09-23.json
      - name: Upload Worker #9 diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker9-direct-terminal-half-kill
          path: artifacts/preloss-direct-terminal-half-kill-audit-2026-09-23.json
          if-no-files-found: warn
          retention-days: 3

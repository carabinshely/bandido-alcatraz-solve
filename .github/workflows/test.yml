name: tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bandido-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical_baselines:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install -e ".[dev]"
      - name: Report runner
        run: python -c "import os, platform; print('Runner=' + os.environ['RUNNER_NAME']); print('Python=' + platform.python_version())"
      - name: Two independent canonical baseline processes
        run: |
          PYTHONHASHSEED=0 python scripts/run_real_policy_v4_canonical_baseline.py --output /tmp/canonical-baseline-hash0.json &
          pid0=$!
          PYTHONHASHSEED=1 python scripts/run_real_policy_v4_canonical_baseline.py --output /tmp/canonical-baseline-hash1.json &
          pid1=$!
          wait $pid0
          wait $pid1
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-baselines
          path: |
            /tmp/canonical-baseline-hash0.json
            /tmp/canonical-baseline-hash1.json
          if-no-files-found: error

  diagnose:
    needs: [canonical_baselines]
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: canonical-baselines
          path: /tmp/canonical
      - name: Canonical mechanism diagnosis after determinism gate
        env:
          PYTHONHASHSEED: "0"
        run: |
          python scripts/run_real_policy_v4_canonical_mechanism.py \
            --baseline-zero /tmp/canonical/canonical-baseline-hash0.json \
            --baseline-one /tmp/canonical/canonical-baseline-hash1.json \
            --historical-receipt experiments/real-deck-policy-v4/stability-holdout-2026-09-21.json \
            --output /tmp/canonical-mechanism-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-mechanism-replay
          path: /tmp/canonical-mechanism-replay.json
          if-no-files-found: error

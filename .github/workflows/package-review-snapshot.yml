name: package-review-snapshot

on:
  push:
    branches: ["integration/solver-foundation-clean"]

permissions:
  contents: read

jobs:
  package:
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build review package
        run: |
          git cat-file -e 5155c42c796ecb049d441f86f1c3801e6afa446e^{commit}
          git ls-tree -rl 5155c42c796ecb049d441f86f1c3801e6afa446e > historical-tree.txt
          git ls-tree -rl HEAD > current-tree.txt
          git archive --format=tar HEAD | gzip -n > current-snapshot.tar.gz
          sha256sum current-snapshot.tar.gz > current-snapshot.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-review-snapshot
          path: |
            historical-tree.txt
            current-tree.txt
            current-snapshot.tar.gz
            current-snapshot.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

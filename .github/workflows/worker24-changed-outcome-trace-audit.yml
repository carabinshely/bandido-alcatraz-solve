name: Worker 24 changed-outcome trace audit

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  trace:
    if: github.head_ref == 'research/v6-changed-outcome-trace-audit-2026-09-29'
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Report runner and exact head
        run: |
          python -c "import os, platform; print('Runner=' + os.environ['RUNNER_NAME']); print('Python=' + platform.python_version())"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - run: python -m pip install -e ".[dev]"
      - name: Worker 24 authoritative changed-outcome trace audit
        env:
          EVALUATED_COMMIT: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: python scripts/run_worker24_changed_outcome_trace_audit.py
      - name: Upload Worker 24 raw and summary
        uses: actions/upload-artifact@v4
        with:
          name: worker24-changed-outcome-trace-audit
          path: |
            artifacts/worker24-changed-outcome-trace-audit.json
            artifacts/worker24-changed-outcome-trace-summary.json
          if-no-files-found: error

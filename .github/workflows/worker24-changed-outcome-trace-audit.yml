name: Worker 24 persist trace audit

on:
  pull_request:
    branches: ["main"]

permissions:
  actions: read
  contents: write

jobs:
  persist:
    if: github.head_ref == 'research/v6-changed-outcome-trace-audit-2026-09-29'
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download authoritative Worker 24 artifact
        uses: actions/download-artifact@v4
        with:
          name: worker24-changed-outcome-trace-audit
          path: artifacts/worker24
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36622733886
      - name: Persist compact manifest and remove transient audit
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          raw_path = Path("artifacts/worker24/worker24-changed-outcome-trace-audit.json")
          summary_path = Path("artifacts/worker24/worker24-changed-outcome-trace-summary.json")
          raw_bytes = raw_path.read_bytes()
          summary_bytes = summary_path.read_bytes()
          raw = json.loads(raw_bytes)
          summary = json.loads(summary_bytes)

          def sha(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          assert len(raw_bytes) == 1943351
          assert sha(raw_bytes) == "1dabf0e22dd5d4b7cf8aa2da792dc90bd7bf765d184d9839e1a80b95a360e143"
          assert len(summary_bytes) == 172448
          assert sha(summary_bytes) == "eb2cf94c69c99e1a94b472575a71d9c122914c892da530cda3bd797d0b2932d6"
          assert raw["classification"] == "v6_changed_outcome_trace_mechanism_resolved"
          assert raw["integrity"]["passed"] is True
          assert raw["integrity"]["final_record_exact_matches"] == 64
          assert raw["integrity"]["transition_label_exact_matches"] == 32
          assert raw["trace_completeness"]["complete_trace"] is True
          assert raw["trace_completeness"]["downstream_linked"] is True
          assert raw["trace_completeness"]["seed_trace_errors"] == []
          assert len(raw["traces"]) == 32
          assert all(
              trace["first_tier_divergence"]["label"] == "tier_expansion"
              for trace in raw["traces"]
          )
          assert all(
              trace["first_selected_divergence"]["tier_sets_differ_here"]
              for trace in raw["traces"]
          )

          def compact_move(move):
              if move is None:
                  return None
              return {
                  "action": move["action"],
                  "card_id": move["card_id"],
                  "hand_index": move["hand_index"],
                  "origin": move["origin"],
                  "quarter_turns": move["quarter_turns"],
              }

          raw_by_seed = {trace["seed"]: trace for trace in raw["traces"]}
          compact_divergences = {}
          for seed_text, item in summary["first_divergences"].items():
              seed = int(seed_text)
              trace = raw_by_seed[seed]
              first_tier = item["first_tier"]
              first_selected = item["first_selected"]
              compact_divergences[seed_text] = {
                  "expected_transition": trace["expected_transition"],
                  "first_tier": {
                      "decision_index": first_tier["decision_index"],
                      "turn_index": first_tier["turn_index"],
                      "label": first_tier["label"],
                      "v4_selected_move": compact_move(first_tier["v4_selected_move"]),
                      "v6_best_first_tier_count": len(
                          trace["first_tier_divergence"]["v6_best_first_tier"]
                      ),
                      "rng_after_equal": trace["first_tier_divergence"][
                          "rng_state_digest_after"
                      ]["equal"],
                  },
                  "first_selected": {
                      "decision_index": first_selected["decision_index"],
                      "turn_index": first_selected["turn_index"],
                      "v4": compact_move(first_selected["v4"]),
                      "v6": compact_move(first_selected["v6"]),
                      "tier_sets_differ_here": first_selected[
                          "tier_sets_differ_here"
                      ],
                      "rng_before_equal": trace["first_selected_divergence"][
                          "rng_state_digest_before"
                      ]["equal"],
                  },
                  "relation": item["relation"],
              }

          def compact_milestone(item):
              return {
                  key: value
                  for key, value in item.items()
                  if key != "deltas_when_both"
              }

          milestone_keep = (
              "first_equipment_ready_turn",
              "first_water_clear_after_visible_turn",
              "first_return_open_tunnels_le_10_after_above_turn",
              "first_return_open_tunnels_le_5_after_above_turn",
              "first_exit_seen_turn",
              "first_legal_exit_placement_turn",
              "exit_placed_turn",
              "refresh_count",
              "terminal_turn",
          )

          cohort_compact = {}
          for name, cohort in summary["cohort_summaries"].items():
              contributions = cohort["weighted_second_step_contributions"]
              cohort_compact[name] = {
                  "seed_count": cohort["seed_count"],
                  "seeds": cohort["seeds"],
                  "divergence_label_counts": cohort["divergence_label_counts"],
                  "selected_divergence_relation_counts": cohort[
                      "selected_divergence_relation_counts"
                  ],
                  "selected_divergence_tier_sets_differ_counts": cohort[
                      "selected_divergence_tier_sets_differ_counts"
                  ],
                  "action_type_pairs_at_first_selected_divergence": cohort[
                      "action_type_pairs_at_first_selected_divergence"
                  ],
                  "actual_selected_action_pairs_at_first_tier_divergence": cohort[
                      "actual_selected_action_pairs_at_first_tier_divergence"
                  ],
                  "first_tier_divergence_turn_distribution": cohort[
                      "first_tier_divergence_turn_distribution"
                  ],
                  "second_step_contributions": {
                      "best_second_option_count": contributions[
                          "best_second_option_count"
                      ],
                      "weighted_totals_by_feature": contributions[
                          "weighted_totals_by_feature"
                      ],
                      "positive_option_occurrences_by_feature": contributions[
                          "positive_option_occurrences_by_feature"
                      ],
                      "negative_option_occurrences_by_feature": contributions[
                          "negative_option_occurrences_by_feature"
                      ],
                  },
                  "immediate_actual_selected_divergence_effect": cohort[
                      "immediate_actual_selected_divergence_effect"
                  ],
                  "first_tier_v6_preference_effect": cohort[
                      "first_tier_v6_preference_effect"
                  ],
                  "milestone_differences": {
                      field: compact_milestone(
                          cohort["milestone_differences"][field]
                      )
                      for field in milestone_keep
                  },
              }

          diagnostics = summary["diagnostic_answers"]
          manifest = {
              "schema": "bandido-alcatraz-v6-changed-outcome-trace-audit-manifest",
              "schema_version": 1,
              "date": "2026-09-29",
              "dataset_status": (
                  "already-spent / outcome-selected diagnostic / non-confirmatory"
              ),
              "preregistration_url": (
                  "https://github.com/carabinshely/bandido-alcatraz-solve/"
                  "issues/2#issuecomment-5897161086"
              ),
              "starting_main": "89559d71d8b59e5c794510ea7481331c63803a8e",
              "authoritative_diagnostic_commit": (
                  "a463edfd2be52fe271642d5e8f07ddb008b48d6e"
              ),
              "classification": raw["classification"],
              "integrity": raw["integrity"],
              "trace_completeness": raw["trace_completeness"],
              "seed_scope": raw["seed_scope"],
              "fresh_seeds_used": False,
              "holdout_used": False,
              "hidden_draw_diagnostic_fields_logged": False,
              "v4_production_vs_no_draw_feature_equivalence": raw[
                  "v4_production_vs_no_draw_feature_equivalence"
              ],
              "source_blobs": {
                  "src/bandido_alcatraz/policies.py": (
                      "0be6b930fdf18e5aac15a75e63eb32aea71f3b68"
                  ),
                  "src/bandido_alcatraz/strategy.py": (
                      "55374c0391f0efc0f783c0b86baf12c40c79f42c"
                  ),
                  "src/bandido_alcatraz/board.py": (
                      "b4f76b6f948eaffe320855156e569a596fe6c213"
                  ),
                  "src/bandido_alcatraz/game.py": (
                      "73d79daa011ff5493b02966fe1157a5ada17df73"
                  ),
                  "src/bandido_alcatraz/simulate.py": (
                      "b2d25ecd0714b5515215047ffcaa471eede3f6e4"
                  ),
                  "data/deck-v1.json": (
                      "9fa2066507ff9a0fb6b922d52e84529b35acb05e"
                  ),
                  "data/deck-observations-v0.json": (
                      "ee38d60277c79dafa7527876367e3e6450ccb53f"
                  ),
              },
              "authoritative_diagnostic_ci": {
                  "run_id": 36622733886,
                  "url": (
                      "https://github.com/carabinshely/bandido-alcatraz-solve/"
                      "actions/runs/36622733886"
                  ),
                  "conclusion": "success",
                  "runner": "bandido-alcatraz-ci",
                  "python": "3.11.16",
                  "github_artifact_id": 11059019669,
                  "github_artifact_zip_bytes": 104224,
                  "github_artifact_zip_sha256": (
                      "4d85d6d468671005b2baf3189f5ff064"
                      "a2d28fd88195f7d9651b89c6de13fbd3"
                  ),
              },
              "raw_artifact": {
                  "drive_parent_folder_id": (
                      "1sQhQY3aKuHvQfyOTUIQjJGANCKOwKgEd"
                  ),
                  "drive_file_id": "1MZQuxnILJmr_Mv0ICAOP57hxfXYRtcwh",
                  "drive_url": (
                      "https://drive.google.com/file/d/"
                      "1MZQuxnILJmr_Mv0ICAOP57hxfXYRtcwh/view?usp=drivesdk"
                  ),
                  "archive_filename": (
                      "worker24-changed-outcome-trace-audit-2026-09-29.zip"
                  ),
                  "archive_bytes": 104224,
                  "archive_sha256": (
                      "4d85d6d468671005b2baf3189f5ff064"
                      "a2d28fd88195f7d9651b89c6de13fbd3"
                  ),
                  "inner_files": {
                      "worker24-changed-outcome-trace-audit.json": {
                          "bytes": 1943351,
                          "sha256": (
                              "1dabf0e22dd5d4b7cf8aa2da792dc90b"
                              "d7bf765d184d9839e1a80b95a360e143"
                          ),
                      },
                      "worker24-changed-outcome-trace-summary.json": {
                          "bytes": 172448,
                          "sha256": (
                              "eb2cf94c69c99e1a94b472575a71d9c1"
                              "22914c892da530cda3bd797d0b2932d6"
                          ),
                      },
                  },
                  "readback_verification": {
                      "verified": True,
                      "provider_metadata_bytes": 104224,
                      "downloaded_readback_bytes": 104224,
                      "downloaded_readback_sha256": (
                          "4d85d6d468671005b2baf3189f5ff064"
                          "a2d28fd88195f7d9651b89c6de13fbd3"
                      ),
                      "parent_folder_verified": True,
                  },
              },
              "mechanism_overview": {
                  "all_changed_outcomes_traceable": diagnostics[
                      "q1_all_32_terminal_category_changes_traceable_to_deterministic_tier_divergence"
                  ],
                  "first_tier_label_counts": cohort_compact["all_32"][
                      "divergence_label_counts"
                  ],
                  "first_selected_divergence_relation_counts": cohort_compact[
                      "all_32"
                  ]["selected_divergence_relation_counts"],
                  "selected_divergence_tiers_differ_counts": cohort_compact[
                      "all_32"
                  ]["selected_divergence_tier_sets_differ_counts"],
                  "first_tier_turn_distribution": cohort_compact["all_32"][
                      "first_tier_divergence_turn_distribution"
                  ],
                  "feature_contribution_aggregate": diagnostics[
                      "q7_second_step_feature_contributions_most_often_positive"
                  ],
                  "facts": [
                      (
                          "All 32 first deterministic tier divergences are "
                          "tier_expansion; this is a common ranking shape, not "
                          "evidence of one common downstream outcome mechanism."
                      ),
                      (
                          "At the first selected divergence, visible water, "
                          "water obstruction, and trapped water are unchanged "
                          "between selected V4 and V6 first actions for all "
                          "32 seeds."
                      ),
                      (
                          "The dominant positive second-step contributions are "
                          "existing V4 collect_needed and "
                          "bounded_merge_setup_gain; delta_open_tunnels is "
                          "net negative and water-feature contributions are "
                          "zero at these first-divergence best-second options."
                      ),
                      (
                          "Therefore the strong endpoint water/compactness "
                          "differences emerge downstream after the initial "
                          "lookahead-induced tier expansion rather than from "
                          "a direct first-divergence water reward."
                      ),
                  ],
              },
              "win_discordant_mechanisms": {
                  "v4_win_to_v6_loss": diagnostics["q2_lost_v4_wins"],
                  "v6_only_wins": diagnostics["q3_gained_v6_wins"],
                  "gain_vs_loss": diagnostics[
                      "q4_gain_vs_loss_first_divergence_labels"
                  ],
              },
              "failure_switch_mechanisms": {
                  "deck_exhausted_to_no_legal_move": cohort_compact[
                      "deck_exhausted_to_no_legal_move"
                  ],
                  "no_legal_move_to_deck_exhausted": cohort_compact[
                      "no_legal_move_to_deck_exhausted"
                  ],
                  "other_failure_switches": cohort_compact[
                      "other_failure_switches"
                  ],
              },
              "all_32_cohort": cohort_compact["all_32"],
              "per_seed_first_divergences": compact_divergences,
              "interpretation_limits": raw["interpretation_limits"],
              "checkpoint_cleanup": {
                  "transient_harness_removed": True,
                  "transient_workflow_removed": True,
                  "final_diff_expected": "manifest-only",
              },
          }

          out = Path(
              "experiments/real-deck-policy-v6/"
              "changed-outcome-trace-audit-2026-09-29.manifest.json"
          )
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          git rm scripts/run_worker24_changed_outcome_trace_audit.py
          git rm .github/workflows/worker24-changed-outcome-trace-audit.yml
          git add "$out" 2>/dev/null || true
          git add experiments/real-deck-policy-v6/changed-outcome-trace-audit-2026-09-29.manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist Worker 24 changed-outcome trace audit"
          git push origin HEAD:${{ github.head_ref }}
          PY

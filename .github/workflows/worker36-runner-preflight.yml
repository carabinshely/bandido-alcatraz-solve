name: Worker36 zero-evaluator runner preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker36-zero-evaluator-runner-preflight
  cancel-in-progress: false

jobs:
  runner-preflight:
    if: >-
      github.repository == 'carabinshely/bandido-alcatraz-solve' &&
      github.event.sender.login == 'carabinshely' && github.actor == 'carabinshely' &&
      github.event.pull_request.user.login == 'carabinshely' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/worker36-synthetic-profile-overhead' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == '9c1eeeb8a26868d41f8d8d89b17fc897a60cb38b'
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Probe unchanged sanitized runtime and finite focused stubs only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for variable in "${!LD@}" "${!PYTHON@}"; do
            [[ -z "$variable" ]] || unset "$variable"
          done
          output="$RUNNER_TEMP/worker36-runner-preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 -- "$output"
          printf 'WORKER36_PREFLIGHT_OUTPUT=%s\n' "$output" >> "$GITHUB_ENV"
          printf 'measurement_admitted=false\nevaluator_calls=0\n' > "$output/launcher.txt"
          source "$GITHUB_WORKSPACE/scripts/worker36-loader.sh"
          if worker36_loader_setup; then
            printf 'loader_setup_exit_code=0\n' >> "$output/launcher.txt"
          else
            status=$?
            printf 'loader_setup_exit_code=%s\n' "$status" >> "$output/launcher.txt"
            exit "$status"
          fi
          printf 'executable=%s\nlibrary=%s\nlibrary_sha256=%s\nlibrary_size_bytes=%s\n' \
            "$WORKER36_PYTHON" "$WORKER36_LOADER_LIBRARY" "$WORKER36_LOADER_SHA256" "$WORKER36_LOADER_SIZE_BYTES" >> "$output/launcher.txt"
          jq -n --arg executable "$WORKER36_PYTHON" --arg directory "$WORKER36_LOADER_DIRECTORY" \
            --arg library "$WORKER36_LOADER_LIBRARY" --arg sha256 "$WORKER36_LOADER_SHA256" \
            --argjson bytes "$WORKER36_LOADER_SIZE_BYTES" \
            '{executable_path:$executable,library_directory:$directory,library_path:$library,
              library_sha256:$sha256,library_size_bytes:$bytes}' > "$output/shell-loader.json"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          tree=$(git rev-parse 'HEAD^{tree}')
          # Setup supplies exactly the verified corresponding library directory.
          # Actual pinned startup is observed without fallback or retry.
          if timeout --signal=TERM --kill-after=5s 600s \
            "$WORKER36_PYTHON" -B -s scripts/worker36/runner_preflight.py \
            --report "$output/runner-preflight.json" \
            --expected-head "$EXPECTED_HEAD" --expected-tree "$tree" \
            > "$output/parent.stdout" 2> "$output/parent.stderr"; then
            status=0
          else
            status=$?
          fi
          printf 'parent_exit_code=%s\n' "$status" >> "$output/launcher.txt"
          cat "$output/parent.stdout" "$output/parent.stderr"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always() && env.WORKER36_PREFLIGHT_OUTPUT != ''
        with:
          name: worker36-zero-evaluator-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WORKER36_PREFLIGHT_OUTPUT }}/*
          if-no-files-found: error
          compression-level: 0
      # This job has no admission/claim, restoration, fixture or measurement step.
      # A passed preflight cannot authorize or dispatch the separate measurement.

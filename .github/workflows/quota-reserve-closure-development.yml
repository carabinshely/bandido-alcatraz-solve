name: Worker35 quota-reserve closure development

on:
  pull_request:
    types: [opened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: worker35-development-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  synthetic-preflight:
    if: >-
      github.event.action != 'edited' &&
      github.repository == 'carabinshely/bandido-alcatraz-solve' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/worker35-quota-reserve-closure'
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Report exact synthetic-only runtime
        run: python -B -c "import hashlib,pathlib,platform,sys; p=pathlib.Path(sys.executable).resolve(); print(platform.python_implementation(), platform.python_version(),p,hashlib.sha256(p.read_bytes()).hexdigest()); assert platform.python_implementation()=='CPython' and platform.python_version()=='3.11.16'"
      - run: python -B -m pip install pytest==8.4.2
      - name: Worker35 invented-fixture tests only
        run: python -B -m pytest -q tests/test_quota_reserve_closure.py tests/test_quota_reserve_closure_reference.py tests/test_quota_closure_pairing.py tests/test_quota_closure_development.py tests/test_verify_worker35_development.py

      - name: Measure invented production-profile fixtures
        id: benchmark
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/worker35-synthetic-resource-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
        run: |
          set -euo pipefail
          test ! -e "$BENCHMARK_OUTPUT"
          python -B scripts/benchmark_worker35_synthetic.py \
            --expected-candidate-sha256 f7e61f41b2757db57ed9f06a6857a4115ce1994200670287b29b35345e702a2f \
            --expected-reference-sha256 4a27004f3761556e09953205cb69edf9cb3f32516ef569bccc831ff94bbcc498 \
            --wall-seconds 180 --memory-mib 2048 --operation-ceiling 32768 --sizes 0,4,8,40,48 \
            | tee "$BENCHMARK_OUTPUT"
      - name: Upload synthetic-only resource measurements
        if: always() && steps.benchmark.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: worker35-synthetic-resource-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker35-synthetic-resource-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
          if-no-files-found: error
          retention-days: 7

  development:
    outputs:
      parts: ${{ steps.package.outputs.parts }}
      admitted: ${{ steps.admit.outputs.admitted }}
    if: >-
      github.event.action == 'edited' &&
      github.repository == 'carabinshely/bandido-alcatraz-solve' &&
      github.actor == 'carabinshely' &&
      github.event.pull_request.user.login == 'carabinshely' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/worker35-quota-reserve-closure' &&
      github.event.pull_request.draft &&
      contains(github.event.pull_request.body, 'WORKER35_EXECUTION_GO_JSON') &&
      !contains(github.event.changes.body.from, 'WORKER35_EXECUTION_GO_JSON')
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    # Infrastructure backstop only. All scientific/resource limits are mandatory
    # in the prospective freeze; missing freeze cannot initialize or compute.
    timeout-minutes: 1380
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONPATH: src
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      OUTPUT_DIR: ${{ github.workspace }}/../bandido-quota-closure-development/${{ github.run_id }}/${{ github.run_attempt }}
      FREEZE_FILE: experiments/quota-reserve-closure-development/execution-freeze.json
      PREREGISTRATION_URL: https://github.com/carabinshely/bandido-alcatraz-solve/issues/2#issuecomment-5947200127
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact first-admission transition
        id: admit
        run: >-
          python3 -B scripts/run_quota_reserve_closure_development.py admit
          --output-dir "$OUTPUT_DIR" --expected-head "$EXPECTED_HEAD"
          --freeze "$FREEZE_FILE" --preregistration-url "$PREREGISTRATION_URL"
      - name: Initialize evidence before dependencies and tests
        id: initialize
        if: steps.admit.outputs.admitted == 'true'
        run: >-
          python3 -B scripts/run_quota_reserve_closure_development.py initialize
          --output-dir "$OUTPUT_DIR" --expected-head "$EXPECTED_HEAD"
          --freeze "$FREEZE_FILE" --preregistration-url "$PREREGISTRATION_URL"
      - uses: actions/setup-python@v5
        if: steps.initialize.outcome == 'success'
        with:
          python-version: '3.11.16'
      - run: python -B -m pip install pytest==8.4.2
        if: steps.initialize.outcome == 'success'
      - name: Worker35 focused synthetic tests
        id: tests
        if: steps.initialize.outcome == 'success'
        run: python -B -m pytest -q tests/test_quota_reserve_closure.py tests/test_quota_reserve_closure_reference.py tests/test_quota_closure_pairing.py tests/test_quota_closure_development.py tests/test_verify_worker35_development.py
      - name: Three complete fixed development phases
        id: cohort
        if: steps.tests.outcome == 'success'
        run: >-
          python -B scripts/run_quota_reserve_closure_development.py run
          --output-dir "$OUTPUT_DIR" --expected-head "$EXPECTED_HEAD"
          --freeze "$FREEZE_FILE" --preregistration-url "$PREREGISTRATION_URL"
      - name: Reconcile final status
        id: finalize
        if: always() && steps.admit.outputs.admitted == 'true'
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          COHORT_OUTCOME: ${{ steps.cohort.outcome }}
        run: >-
          python -B scripts/run_quota_reserve_closure_development.py finalize
          --output-dir "$OUTPUT_DIR" --expected-head "$EXPECTED_HEAD"
          --freeze "$FREEZE_FILE" --preregistration-url "$PREREGISTRATION_URL"
          --test-outcome "$TEST_OUTCOME" --cohort-outcome "$COHORT_OUTCOME"
      - name: Preserve deterministic evidence shards
        id: package
        if: always() && steps.admit.outputs.admitted == 'true'
        run: >-
          python -B scripts/run_quota_reserve_closure_development.py package
          --output-dir "$OUTPUT_DIR" --expected-head "$EXPECTED_HEAD"
          --freeze "$FREEZE_FILE" --preregistration-url "$PREREGISTRATION_URL"
      - name: Upload complete or partial evidence always
        if: always() && steps.admit.outputs.admitted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: worker35-quota-reserve-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_DIR }}-transport/artifact-manifest.json
            ${{ env.OUTPUT_DIR }}/receipt.json
            ${{ env.OUTPUT_DIR }}/recovery-receipt-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  upload-shards:
    needs: development
    if: >-
      always() && needs.development.outputs.admitted == 'true' &&
      needs.development.outputs.parts != '' && needs.development.outputs.parts != '[]'
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.development.outputs.parts) }}
    runs-on: [self-hosted, Linux, X64, bandido-alcatraz-ci]
    timeout-minutes: 10
    steps:
      - name: Upload one bounded complete or partial evidence shard
        uses: actions/upload-artifact@v4
        with:
          name: worker35-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.part }}
          path: ${{ github.workspace }}/../bandido-quota-closure-development/${{ github.run_id }}/${{ github.run_attempt }}-transport/${{ matrix.part }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
